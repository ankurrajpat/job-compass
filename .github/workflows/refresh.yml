name: Daily index refresh
on:
  schedule: [{cron: '17 3 * * *'}]
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: compass.db
          key: index-${{ github.run_id }}
          restore-keys: index-
      - run: python ingest.py --database compass.db --dense --report ingest-report.json
      - uses: actions/upload-artifact@v4
        with: {name: ingest-report, path: ingest-report.json}
