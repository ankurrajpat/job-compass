name: Verify
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python evaluate.py
      - run: docker build -t job-compass .
      - run: |
          docker run -d --name compass -p 7860:7860 job-compass
          for i in $(seq 1 30); do curl -fsS http://localhost:7860/api/health && exit 0; sleep 2; done
          docker logs compass
          exit 1
